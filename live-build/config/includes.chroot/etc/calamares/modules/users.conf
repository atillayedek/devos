userGroup:       users
defaultGroups:
    - cdrom
    - floppy
    - sudo
    - audio
    - dip
    - video
    - plugdev
    - netdev
    - lpadmin
    - scanner
    - bluetooth
    - dialout
    - render
    - kvm
    - libvirt
    - docker
    - name: devos-dev
      must_exist: false
      system: true
autologinGroup:  autologin
sudoersGroup:    sudo
setRootPassword: false
doAutologin:     false
passwordRequirements:
    nonempty: true
    minLength: -1
    maxLength: -1
