# DevOS installer — based on Debian 13's calamares-settings-debian sequence,
# plus the installation-mode page and the DevOS developer provisioning job.
modules-search: [ local, /usr/lib/calamares/modules ]

instances:
- id:       devosmode
  module:   packagechooser
  config:   packagechooser-devosmode.conf

sequence:
- show:
  - welcome
  - locale
  - keyboard
  - partition
  - packagechooser@devosmode
  - users
  - summary
- exec:
  - partition
  - mount
  - unpackfs
  - luksbootkeyfile
  - dpkg-unsafe-io
  - sources-media
  - machineid
  - fstab
  - locale
  - keyboard
  - localecfg
  - users
  - displaymanager
  - networkcfg
  - hwclock
  - services-systemd
  - bootloader-config
  - grubcfg
  - bootloader
  - packages
  - plymouthcfg
  - initramfscfg
  - initramfs
  - dpkg-unsafe-io-undo
  - sources-media-unmount
  - sources-final
  - devosprovision
  - umount
- show:
  - finished

branding: devos
prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: false
quit-at-end: false
