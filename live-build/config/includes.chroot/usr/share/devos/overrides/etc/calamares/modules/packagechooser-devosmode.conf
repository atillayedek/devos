# Stored in GlobalStorage as "packagechooser_devosmode" and read by the devosprovision job.
mode: required
method: legacy
labels:
  step: "Developer setup"
items:
  - id: online
    name: "DevOS Full — Online (recommended)"
    description: >-
      Installs DevOS and, using your internet connection, downloads the remaining developer
      tools from their official vendors so everything is ready at first login: Google Chrome,
      Visual Studio Code, JetBrains IDEs (IntelliJ IDEA, PyCharm, WebStorm, PhpStorm, CLion, GoLand,
      Rider, DataGrip, RustRover, Toolbox), Android Studio + Android SDK/NDK/emulator image,
      Claude Code, Google Cloud CLI and editor AI extensions — plus the latest Node.js, Flutter,
      Rust, Go, .NET, Java, Kotlin, Gradle, DevOps and cloud CLIs.
      These proprietary tools are subject to their vendors' licenses
      (Android SDK: developer.android.com/studio/terms · Chrome: google.com/chrome/terms ·
      VS Code: code.visualstudio.com/license · JetBrains: jetbrains.com/legal/docs/toolbox/user ·
      Anthropic: anthropic.com/legal/commercial-terms · Google Cloud: cloud.google.com/terms).
      By choosing this option you accept those licenses. Connect to Wi-Fi or Ethernet first
      (network icon in the panel). Downloads are several GB; installation takes longer.
    screenshot: "/usr/share/devos/branding/mode-online.png"
  - id: offline
    name: "DevOS Full — Offline"
    description: >-
      Installs only what is on this ISO (all open-source/redistributable developer tools).
      Nothing is downloaded. After installation, Developer Center shows
      "Developer Environment Setup incomplete" and can download the remaining official tools
      with one click once you are online and have accepted their licenses.
    screenshot: "/usr/share/devos/branding/mode-offline.png"
