# DevOS tool manifest — the single source of truth for what a DevOS Full
# installation contains, how each tool is installed, whether its license allows
# shipping it inside the ISO, and how its health is verified.
#
# Fields
#   id               unique key
#   name             display name
#   category         grouping used by Developer Center
#   stage            provisioning stage (see `stages` below, executed in order)
#   required         counts towards "Developer Environment: READY"
#   redistributable  true  -> may be baked into DevOS-Full-Offline.iso
#                    false -> fetched from the vendor's official source at install
#                             time (or later from Developer Center), never shipped
#   license          short license note shown in Developer Center / installer
#   license_url      vendor license the user accepts by choosing Full Online
#   install          how to install it:
#                      method: apt        -> packages from the Debian archive (baked into every ISO)
#                      method: apt-repo   -> vendor apt repository (repo key in `repos`)
#                      method: handler    -> Python handler in devos/provision/handlers.py
#                      method: npm        -> npm global package into /opt/devos/npm
#                      method: uv-tool    -> Python CLI isolated by `uv tool install`
#                      method: flatpak    -> Flathub application (system-wide)
#   health           list of checks; ALL must pass for status "Working"
#                      cmd:     argv run as the logged-in user (exit 0 required)
#                      expect:  optional regex the combined output must match
#                      desktop: desktop file id that must exist with a runnable Exec
#                      special: kvm | network | docker | podman | flutter | android-sdk | jetbrains:<dir> | flatpak:<appid>
#   desktop          desktop entry id shown in the menu (for launch from Developer Center)

stages:
  - packages        # 5. development packages (Debian archive, already on the ISO)
  - languages       # 6. programming languages
  - android         # 7. Android SDK + Android Studio
  - flutter         # 8. Flutter
  - containers      # 9. containers
  - virtualization  # 10. virtualization
  - windows         # 11. Wine / Bottles
  - browsers        # 12. browsers
  - ides            # 13. IDEs
  - jetbrains       # 14. JetBrains
  - ai              # 15. AI CLI tools
  - cloud           # 16. cloud CLIs
  - git             # 17. Git tooling
  - environment     # 18. environment variables
  - desktop         # 19. desktop entries
  - health          # 20. health checks
  - cleanup         # 21. caches cleanup
  - snapshot        # 22. final snapshot

repos:
  vscode:
    url: https://packages.microsoft.com/repos/code
    suite: stable
    components: main
    arch: amd64
    key_url: https://packages.microsoft.com/keys/microsoft.asc
  vscodium:
    url: https://download.vscodium.com/debs
    suite: vscodium
    components: main
    arch: amd64
    key_url: https://gitlab.com/paulcarroty/vscodium-deb-rpm-repo/raw/master/pub.gpg
  google-chrome:
    url: https://dl.google.com/linux/chrome/deb/
    suite: stable
    components: main
    arch: amd64
    key_url: https://dl.google.com/linux/linux_signing_key.pub
    list_name: google-chrome
  dbeaver:
    url: https://dbeaver.io/debs/dbeaver-ce
    suite: /
    components: ""
    key_url: https://dbeaver.io/debs/dbeaver.gpg.key
  google-cloud:
    url: https://packages.cloud.google.com/apt
    suite: cloud-sdk
    components: main
    key_url: https://packages.cloud.google.com/apt/doc/apt-key.gpg
  cloudflare:
    url: https://pkg.cloudflare.com/cloudflared
    suite: any
    components: main
    key_url: https://pkg.cloudflare.com/cloudflare-main.gpg
  winehq:
    url: https://dl.winehq.org/wine-builds/debian/
    suite: trixie
    components: main
    arch: amd64,i386
    key_url: https://dl.winehq.org/wine-builds/winehq.key

